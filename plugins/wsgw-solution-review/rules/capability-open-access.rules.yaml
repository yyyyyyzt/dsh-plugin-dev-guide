        - { kind: section, params: { heading: implementation } }
        - { kind: section, params: { heading: resources, minChars: 6 } }
        - { kind: section, params: { heading: risk, minChars: 6 } }
        - { kind: section, params: { heading: attachments, minChars: 6 } }
    status: active
    provenance:
